<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OneTap QR Generator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .controls {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    input {
      width: 180px;
      padding: 12px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 12px 18px;
      margin: 5px;
      border: 0;
      border-radius: 6px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #qrGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .qr-card {
      background: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      page-break-inside: avoid;
    }

    .qr {
      display: flex;
      justify-content: center;
    }

    .card-code {
      font-size: 18px;
      font-weight: bold;
      margin-top: 12px;
      letter-spacing: 1px;
    }

    .small {
      font-size: 11px;
      color: #777;
      margin-top: 6px;
      word-break: break-all;
    }

    @media print {
      .controls,
      h1,
      .subtitle {
        display: none;
      }

      body {
        background: white;
      }

      .container {
        margin: 0;
        max-width: none;
      }

      #qrGrid {
        grid-template-columns: repeat(4, 1fr);
      }

      .qr-card {
        border: 1px solid #ddd;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>OneTap NFC</h1>
  <div class="subtitle">Bulk QR Code Generator</div>

  <div class="controls">

    <input
      id="startNumber"
      type="number"
      value="1"
      min="1"
      placeholder="Start number"
    >

    <input
      id="endNumber"
      type="number"
      value="10"
      min="1"
      placeholder="End number"
    >

    <button onclick="generateQRs()">
      Generate QR Codes
    </button>

    <button onclick="generatePrintSheets()">
      Generate Print Sheets
    </button>

    <button onclick="window.print()">
      Print
    </button>

  </div>

  <div id="qrGrid"></div>

</div>

<script>

const BASE_URL = "https://onetapnfc.github.io/OneTap/";

const SUPABASE_URL = "https://czhcfwuopdnjirpcvpkk.supabase.co";
const SUPABASE_KEY = "sb_publishable_CQltYcF2F5uNSCJZY7Jhgg_BWJX-IHR";

function makeCardCode(number) {
  return "OT" + String(number).padStart(5, "0");
}

async function generateQRs() {

  const start =
    parseInt(document.getElementById("startNumber").value);

  const end =
    parseInt(document.getElementById("endNumber").value);

  const grid =
    document.getElementById("qrGrid");

  grid.innerHTML = "";

  if (
    isNaN(start) ||
    isNaN(end) ||
    start < 1 ||
    end < start
  ) {
    alert("Please enter a valid number range.");
    return;
  }

  if ((end - start + 1) > 500) {
    alert("Generate a maximum of 500 QR codes at a time.");
    return;
  }

  for (let i = start; i <= end; i++) {

    const cardCode = makeCardCode(i);

    const response = await fetch(
  `${SUPABASE_URL}/rest/v1/rpc/get_card_qr_data`,
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`
    },
    body: JSON.stringify({
      p_card_code: cardCode
    })
  }
);

if (!response.ok) {
  console.error("Could not load:", cardCode);
  continue;
}

let cardData = await response.json();

if (typeof cardData === "string") {
  cardData = JSON.parse(cardData);
}

if (!cardData.found || !cardData.activation_token) {
  console.error("Card/token missing:", cardCode);
  continue;
}

const permanentURL =
  BASE_URL +
  "?id=" + encodeURIComponent(cardCode) +
  "&k=" + encodeURIComponent(cardData.activation_token);

    const card = document.createElement("div");
    card.className = "qr-card";

    const qrContainer = document.createElement("div");
    qrContainer.className = "qr";

    const codeText = document.createElement("div");
    codeText.className = "card-code";
    codeText.textContent = cardCode;

    const urlText = document.createElement("div");
    urlText.className = "small";
    urlText.textContent = permanentURL;

    card.appendChild(qrContainer);
    card.appendChild(codeText);
    card.appendChild(urlText);

    grid.appendChild(card);

    new QRCode(qrContainer, {
      text: permanentURL,
      width: 180,
      height: 180,
      correctLevel: QRCode.CorrectLevel.H
    });
  }
}

  async function generatePrintSheets() {

  const start = parseInt(
    document.getElementById("startNumber").value
  );

  const end = parseInt(
    document.getElementById("endNumber").value
  );

  if (
    isNaN(start) ||
    isNaN(end) ||
    start < 1 ||
    end < start
  ) {
    alert("Please enter a valid number range.");
    return;
  }

  alert(
    `Print Sheet Generator ready!\nCards: ${start} to ${end}`
  );
}

</script>

</body>
</html>
