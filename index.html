<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneTap NFC</title>
</head>

<body>
  <p id="message">Opening OneTap...</p>

  <script>
    const SUPABASE_URL = "https://czhcfwuopdnjirpcvpkk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_CQltYcF2F5uNSCJZY7Jhgg_BWJX-IHR";

    const params = new URLSearchParams(window.location.search);
    const cardCode = params.get("id");

    async function openCard() {
      const message = document.getElementById("message");

      if (!cardCode) {
        message.textContent = "Invalid OneTap card.";
        return;
      }

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/get_card_destination`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify({
              p_card_code: cardCode
            })
          }
        );

        if (!response.ok) {
          throw new Error("Unable to contact OneTap.");
        }

        const data = await response.json();
        console.log("OneTap response:", data, typeof data);

// Card does not exist
if (!data || !data.found) {
  message.textContent = "OneTap card not found.";
  return;
}

// Card has never been activated
if (data.status === "available") {
  message.textContent = "Opening activation...";
  window.location.replace(
    `./activate/?card=${encodeURIComponent(cardCode)}`
  );
  return;
}

// Card is already activated
if (data.destination_url) {
  message.textContent = "Opening OneTap...";
  window.location.replace(data.destination_url);
  return;
}

message.textContent = "Unable to open this OneTap card.";
