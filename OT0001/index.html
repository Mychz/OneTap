<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneTap NFC</title>
</head>

<body>
  <p id="message">Opening your link...</p>

  <script>
    const SUPABASE_URL = "https://czhcfwuopdnjirpcvpkk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_CQltYcF2F5uNSCJZY7Jhgg_BWJX-IHR";

    const CARD_CODE = "OT-TEST01";

    async function redirectCard() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/get_card_destination`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify({
              p_card_code: CARD_CODE
            })
          }
        );

        if (!response.ok) {
          throw new Error("Supabase request failed");
        }

        const data = await response.json();

        if (
          data.found === true &&
          (data.status === "activated" || data.status === "locked") &&
          data.destination_url
        ) {
          window.location.replace(data.destination_url);
          return;
        }

        if (data.found === true && data.status === "available") {
          document.getElementById("message").textContent =
            "This OneTap card has not been activated yet.";
          return;
        }

        document.getElementById("message").textContent =
          "OneTap card not found.";

      } catch (error) {
        console.error(error);
        document.getElementById("message").textContent =
          "Unable to open this OneTap card.";
      }
    }

    redirectCard();
  </script>
</body>
</html>
